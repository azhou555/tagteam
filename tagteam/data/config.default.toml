# tagteam defaults. Override any key in ~/.tagteam/config.toml or <repo>/.tagteam.toml.

[review]
deadline_s = 240            # per-reviewer wall clock; Stop hook timeout is set above this
max_rounds = 2              # blocking rounds per turn before we always allow
block_at = "major"          # blocker | major | minor
min_confidence = 0.6
min_changed_lines = 5
max_diff_chars = 60000      # total diff text sent to reviewers
ignore = [
  "*.lock", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "Cargo.lock", "poetry.lock", "uv.lock",
  "dist/*", "build/*", "node_modules/*", ".next/*", "*.min.js", "*.min.css", "*.map",
  ".tagteam*", ".claude/settings*.json",
]

[classify]
plan = ["tasks/*", "*todo.md", "*plan*.md", "*PLAN*.md", "docs/plans/*", "*/.claude/plans/*"]
design = ["*design*.md", "*DESIGN*.md", "docs/*.md", "*/adr/*", "RFC*", "*.puml", "*.mmd", "*spec*.md", "*SPEC*.md"]
risk = ["*auth*", "*migration*", "*/migrations/*", "infra/*", "*.sql", ".github/workflows/*", "*secret*", "*security*", "Dockerfile*", "*.tf"]

[routing]
small = 1                   # reviewers for small code changes
large = 2                   # large code changes
high_risk = 3
docs = 2                    # design + plan always get two perspectives
large_lines = 150
primary_use = "overflow"    # overflow | never | balanced
tier_penalty = 4.0          # balanced mode only
cooldown_min = 15
unknown_headroom = 0.5      # assumed headroom when no quota data is available

[agents.copilot]
enabled = true
tier = "reviewer"
model = ""                  # empty = Copilot default; set e.g. a 0x model to save premium requests
weight = { code = 0.9, design = 0.8, plan = 0.8 }
quota = { source = "copilot_api", monthly_budget = 200 }

[agents.agy]
enabled = true
tier = "reviewer"
model = ""
effort = "medium"           # default effort spent ~26k thinking tokens / 200s on a 5-line diff
weight = { code = 0.8, design = 1.0, plan = 1.0 }
quota = { source = "self", daily_budget_runs = 80 }

[agents.claude]
enabled = true
tier = "primary"
model = "sonnet"            # reviewer runs use a cheaper model than your main sessions
weight = { code = 1.0, design = 1.0, plan = 1.0 }
quota = { source = "claude_statusline", reserve_floor = 0.5 }

[agents.codex]
enabled = true
tier = "primary"
model = ""
weight = { code = 1.0, design = 0.7, plan = 0.8 }
quota = { source = "codex_rollout", reserve_floor = 0.5 }
